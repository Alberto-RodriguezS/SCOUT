<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SCOUT Assessment Prototype</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: fixed left rail (app nav) + scrolling workspace; cards only for interactive groups. Single dark look, matching the team mockup. */
:root{
  --bg:#07111f; --rail:#081529; --card:#0c1a30; --card2:#10223d; --line:#1b3050; --line2:#2a4670;
  --fg:#e6eef8; --muted:#94a8c4; --dim:#5f7593;
  --accent:#4fd6ea; --accent-ink:#04212a; --accent-soft:rgba(79,214,234,.12);
  --warn:#f2a93b; --warn-soft:rgba(242,169,59,.12); --crit:#f0625a; --crit-soft:rgba(240,98,90,.12);
  --ok:#4fd18b; --ok-soft:rgba(79,209,139,.12); --violet:#b39cff;
  --fin:#f2a93b; --dat:#7aa7ff; --pro:#4fd6ea;
  --display:"Space Grotesk",ui-sans-serif,system-ui,sans-serif;
  --body:"Inter",ui-sans-serif,system-ui,-apple-system,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font:15px/1.55 var(--body);margin:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--rail)}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
a{color:var(--accent)}
.app{display:grid;grid-template-columns:250px minmax(0,1fr);min-height:100%}
.rail{background:var(--rail);border-right:1px solid var(--line);padding:22px 16px;display:flex;flex-direction:column;gap:22px;position:sticky;top:0;height:100vh}
.brand{display:flex;gap:10px;align-items:center}
.brand svg{flex:none}
.brand b{font:700 24px/1 var(--display);color:var(--fg);letter-spacing:.06em}
.brand small{display:block;color:var(--muted);font-size:11.5px;line-height:1.35;margin-top:6px}
.nav{display:flex;flex-direction:column;gap:4px}
.nav button{background:none;border:0;text-align:left;padding:10px 12px;border-radius:9px;color:var(--muted);display:flex;gap:10px;align-items:center;font-size:14.5px}
.nav button:hover{color:var(--fg);background:var(--card)}
.nav button[aria-current="true"]{background:var(--card2);color:var(--fg)}
.nav .cnt{margin-left:auto;font:500 11px var(--mono);color:var(--dim)}
.ctx{border:1px solid var(--line);border-radius:10px;padding:12px;font-size:12.5px;color:var(--muted);display:grid;gap:4px}
.ctx b{color:var(--fg);font-weight:600}
.rail .foot{margin-top:auto;display:grid;gap:10px;font-size:11.5px;color:var(--dim)}
.btn-ghost{background:transparent;border:1px solid var(--line2);border-radius:9px;padding:10px 12px;color:var(--accent);font-weight:600}
.btn-ghost:hover{background:var(--accent-soft)}
.main{min-width:0;padding-block:20px 60px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.topbar{display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap;margin:0 auto 18px;max-width:1120px}
.pill{font:500 11.5px var(--mono);border:1px solid var(--line2);border-radius:999px;padding:5px 11px;color:var(--muted);display:inline-flex;gap:7px;align-items:center}
.pill i{width:7px;height:7px;border-radius:50%;background:var(--accent);display:inline-block}
.pill.fv{border-style:dashed;color:var(--violet);border-color:rgba(179,156,255,.45)}
.pill.real{color:var(--accent);border-color:rgba(79,214,234,.45)}
.wrap{max-width:1120px;margin:0 auto;display:grid;gap:22px}
.eyebrow{font:500 11.5px var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
h1{font:600 clamp(28px,4vw,42px)/1.12 var(--display);margin:6px 0 10px;text-wrap:balance;letter-spacing:-.01em}
h2{font:600 21px/1.25 var(--display);margin:0;text-wrap:balance}
h3{font:600 16px/1.3 var(--display);margin:0}
.lede{color:var(--muted);max-width:66ch;margin:0;font-size:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:22px}
.card.soft{background:transparent}
.cols{display:grid;grid-template-columns:200px minmax(0,1fr);gap:22px;align-items:start}
.cols3{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:22px;align-items:start}
.steps{display:grid;gap:4px;position:sticky;top:20px}
.steps button{background:none;border:0;display:flex;gap:10px;align-items:center;padding:8px 10px;border-radius:9px;color:var(--muted);text-align:left}
.steps button[aria-current="true"]{background:var(--card2);color:var(--fg)}
.steps .n{width:22px;height:22px;border-radius:50%;border:1px solid var(--line2);display:grid;place-items:center;font:500 11px var(--mono);flex:none}
.steps .done .n{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.field{display:grid;gap:6px;min-width:0}
.field label,.lbl{font:500 11px var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
input[type=text],select,textarea{background:var(--bg);border:1px solid var(--line2);border-radius:9px;padding:11px 12px;color:var(--fg);font:inherit;width:100%}
.row{display:grid;grid-template-columns:2fr 1fr 1fr;gap:14px}
.opts{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.opt{background:var(--bg);border:1px solid var(--line);border-radius:11px;padding:13px 14px;text-align:left;display:grid;gap:3px}
.opt b{font-weight:600;font-size:14.5px}
.opt small{color:var(--muted);font-size:12.5px}
.opt:hover{border-color:var(--line2)}
.opt[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);box-shadow:0 0 0 1px var(--accent) inset}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{background:var(--bg);border:1px solid var(--line2);border-radius:999px;padding:8px 14px;font-size:14px}
.chip:hover{border-color:var(--muted)}
.chip[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);color:var(--fg)}
.chip:disabled{opacity:.4;cursor:not-allowed}
.q{display:grid;gap:10px}
.q + .q{margin-top:22px}
.qt{font:600 17px/1.35 var(--display)}
.help{color:var(--muted);font-size:13.5px;margin:0}
.btns{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:18px;margin-top:22px}
.btn{background:var(--accent);color:var(--accent-ink);border:0;border-radius:9px;padding:11px 18px;font-weight:600}
.btn:hover{filter:brightness(1.08)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn2{background:transparent;border:1px solid var(--line2);border-radius:9px;padding:10px 16px;color:var(--muted)}
.btn2:hover{color:var(--fg)}
.note{border:1px solid var(--line);border-radius:11px;padding:13px 15px;font-size:13.5px;color:var(--muted);background:var(--bg)}
.note b{color:var(--accent);font-weight:600}
.note.warn{border-color:rgba(242,169,59,.4)} .note.warn b{color:var(--warn)}
.side{display:grid;gap:16px;position:sticky;top:20px}
.tag{font:500 10.5px var(--mono);border-radius:6px;padding:2px 7px;border:1px solid var(--line2);color:var(--muted);white-space:nowrap}
.tag.F{color:var(--fin);border-color:rgba(242,169,59,.45)} .tag.D{color:var(--dat);border-color:rgba(122,167,255,.45)} .tag.P{color:var(--pro);border-color:rgba(79,214,234,.45)}
.mono{font:400 12px var(--mono);color:var(--dim)}
.seg{display:inline-flex;border:1px solid var(--line2);border-radius:999px;padding:3px;gap:2px}
.seg button{background:none;border:0;border-radius:999px;padding:6px 14px;color:var(--muted);font-size:13.5px}
.seg button[aria-pressed="true"]{background:var(--accent-soft);color:var(--fg);box-shadow:0 0 0 1px var(--accent) inset}
.cov{display:grid;gap:9px}
.covrow{display:grid;grid-template-columns:86px 1fr 34px;gap:10px;align-items:center;font-size:13px}
.bar{height:7px;border-radius:9px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;border-radius:9px}
.num{font:500 12px var(--mono);text-align:right;font-variant-numeric:tabular-nums}
.route{display:grid;gap:4px;max-height:430px;overflow:auto;padding-right:4px}
.route .grp{font:500 10.5px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--dim);margin:10px 0 2px}
.route button{background:none;border:1px solid transparent;border-radius:8px;text-align:left;padding:7px 9px;display:grid;grid-template-columns:16px 1fr;gap:8px;font-size:12.5px;color:var(--muted);align-items:start}
.route button:hover{border-color:var(--line)}
.route button[aria-current="true"]{border-color:var(--accent);color:var(--fg)}
.dot{width:9px;height:9px;border-radius:50%;border:1.5px solid var(--dim);margin-top:4px}
.dot.a{background:var(--accent);border-color:var(--accent)} .dot.u{background:var(--warn);border-color:var(--warn)}
.qcard{display:grid;gap:16px}
.qhead{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.qtitle{font:600 clamp(20px,2.4vw,25px)/1.3 var(--display);margin:0;text-wrap:balance}
.answers{display:grid;gap:8px}
.answers .opt{display:flex;justify-content:space-between;gap:12px;align-items:center}
.answers .opt.unk{border-style:dashed}
.why{display:grid;gap:6px;border-left:2px solid var(--line2);padding-left:14px}
.why .lbl{color:var(--dim)}
.progress{height:4px;background:var(--line);border-radius:4px;overflow:hidden}
.progress i{display:block;height:100%;background:var(--accent)}
.score{display:grid;grid-template-columns:auto 1fr;gap:28px;align-items:center}
.ring{width:118px;height:118px;position:relative}
.ring svg{transform:rotate(-90deg)}
.ring .v{position:absolute;inset:0;display:grid;place-items:center;text-align:center}
.ring .v b{font:700 34px/1 var(--display)} .ring .v small{display:block;font:500 11px var(--mono);color:var(--muted);margin-top:3px}
.areas{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.area{display:grid;gap:7px}
.area .top{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.area .top b{font:600 15px var(--display)}
.lvl{font:500 11px var(--mono);border-radius:999px;padding:3px 9px}
.lvl.H{background:var(--crit-soft);color:var(--crit)} .lvl.M{background:var(--warn-soft);color:var(--warn)} .lvl.L{background:var(--ok-soft);color:var(--ok)} .lvl.N{background:var(--line);color:var(--muted)}
.vsmwrap{overflow-x:auto;padding-bottom:6px}
.vsm{display:grid;grid-template-columns:repeat(6,minmax(132px,1fr));gap:30px;min-width:960px;position:relative}
.node{background:var(--bg);border:1px solid var(--line2);border-radius:12px;padding:12px;text-align:left;display:grid;gap:5px;position:relative;min-height:138px;align-content:start}
.node:hover{border-color:var(--muted)}
.node[aria-pressed="true"]{box-shadow:0 0 0 2px var(--accent);border-color:var(--accent)}
.node.H{border-color:rgba(240,98,90,.6)} .node.M{border-color:rgba(242,169,59,.55)}
.node .k{font:500 10.5px var(--mono);color:var(--dim)}
.node b{font:600 14px/1.25 var(--display)}
.node .pp{font-size:12px;color:var(--warn)}
.node .pp.none{color:var(--dim)}
.node .inc{font:400 11px var(--mono);color:var(--dim);margin-top:auto}
.node + .node::before{content:"";position:absolute;left:-30px;top:50%;width:30px;height:1px;background:var(--line2)}
.hand{position:absolute;left:-26px;top:calc(50% - 11px);width:22px;height:22px;border-radius:50%;background:var(--card);border:1px solid var(--line2);font:500 10px var(--mono);display:grid;place-items:center;color:var(--muted);z-index:1}
.shared{margin-top:16px;border:1px dashed var(--line2);border-radius:12px;padding:12px 14px;min-width:960px;display:flex;gap:14px;align-items:center;flex-wrap:wrap;text-align:left;background:none;width:100%}
.shared[aria-pressed="true"]{border-color:var(--accent);border-style:solid}
.detail{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:24px;border:1px solid var(--line);border-radius:12px;padding:18px;background:var(--bg)}
.pain{border-left:2px solid var(--warn);padding:2px 0 2px 12px;display:grid;gap:2px}
.pain b{font-weight:600}
.pain span{color:var(--muted);font-size:13.5px}
.actions{display:grid;gap:10px}
.action{border:1px solid var(--line2);border-radius:11px;padding:13px 16px;display:grid;grid-template-columns:34px minmax(0,1fr) auto;gap:12px;align-items:center;background:var(--bg)}
.action .rk{font:600 22px var(--display);color:var(--accent)}
.action.off{opacity:.4}
.action b{font-weight:600;display:block}
.action .meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:5px;align-items:center}
.action .cost{font:500 11px var(--mono);color:var(--muted);text-align:right}
.split{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:center}
.case{border:1px solid var(--line);border-radius:12px;padding:15px 16px;display:grid;gap:7px;background:var(--bg)}
.case .split b{font:600 15px/1.35 var(--display);flex:1 1 260px;min-width:0}
.case .cn{font:500 11px var(--mono);color:var(--accent);border:1px solid var(--line2);border-radius:6px;padding:1px 6px;margin-right:8px;vertical-align:2px}
.match{font:500 11px var(--mono);border-radius:999px;padding:3px 10px;border:1px solid}
.match.s{color:var(--accent);border-color:rgba(79,214,234,.5)} .match.w{color:var(--warn);border-color:rgba(242,169,59,.5)}
.big{font:700 44px/1 var(--display);color:var(--accent)}
.diag p{margin:0 0 10px;max-width:68ch}
.diag cite{font:500 11.5px var(--mono);color:var(--accent);font-style:normal}
pre.json{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:14px;overflow:auto;max-height:360px;font:400 12px/1.5 var(--mono);color:var(--muted);margin:0}
details summary{cursor:pointer;font-weight:600}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th,td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{font:500 11px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.tablewrap{overflow-x:auto}
.layers{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}
.layer{border:1px solid var(--line);border-radius:11px;padding:14px;display:grid;gap:5px;background:var(--bg)}
.layer .k{font:500 11px var(--mono);color:var(--accent)}
.sample{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.toast{position:fixed;right:max(18px,env(safe-area-inset-right,0px));bottom:calc(18px + env(safe-area-inset-bottom,0px));background:var(--card2);border:1px solid var(--accent);border-radius:10px;padding:10px 14px;font-size:13.5px;z-index:20}
.chat{display:grid;gap:10px}
.bubble{border:1px solid var(--line);border-radius:11px;padding:12px 14px;background:var(--bg);font-size:14px}
.bubble.me{border-color:var(--line2);justify-self:end;max-width:80%}
.inline{display:flex;gap:8px}
.inline input{flex:1}
@media (max-width:960px){
  .app{grid-template-columns:1fr}
  .rail{position:static;height:auto;flex-direction:column;padding:14px max(16px,env(safe-area-inset-right,0px)) 12px max(16px,env(safe-area-inset-left,0px));gap:12px}
  .nav{flex-direction:row;overflow-x:auto}
  .nav button{white-space:nowrap}
  .ctx,.rail .foot{display:none}
  .cols,.cols3,.detail{grid-template-columns:1fr}
  .steps{position:static;grid-auto-flow:column;overflow-x:auto}
  .steps button span:last-child{white-space:nowrap}
  .side{position:static}
}
@media (max-width:620px){
  .row{grid-template-columns:1fr}
  .areas{grid-template-columns:1fr}
  .score{grid-template-columns:1fr;justify-items:start}
  .card{padding:16px}
  .action{grid-template-columns:28px minmax(0,1fr)}
  .action .cost{grid-column:2;text-align:left}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="app">
  <aside class="rail">
    <div class="brand">
      <svg class="logo" width="44" height="44" viewBox="0 0 100 100" aria-hidden="true">
  <circle cx="50" cy="50" r="48" fill="#f4f7fc" stroke="#6f9fd8" stroke-width="2"/>
  <circle cx="50" cy="50" r="33" fill="none" stroke="#7fa3cf" stroke-width="3.5" stroke-dasharray="10 6"/>
  <path d="M27 27 L50 50 L73 27" fill="none" stroke="#7fa3cf" stroke-width="2.5"/>
  <g fill="#2a64ad"><circle cx="26.7" cy="26.7" r="5"/><circle cx="73.3" cy="26.7" r="5"/><circle cx="17" cy="50" r="4.5"/><circle cx="83" cy="50" r="4.5"/><circle cx="50" cy="83" r="5.5"/></g>
  <path d="M50 6 L57 43 L94 50 L57 57 L50 94 L43 57 L6 50 L43 43 Z" fill="#2a64ad"/>
  <path d="M50 6 L57 43 L50 50 Z M94 50 L57 57 L50 50 Z M50 94 L43 57 L50 50 Z M6 50 L43 43 L50 50 Z" fill="#6aa0e0"/>
  <circle cx="50" cy="50" r="9" fill="#f4f7fc"/><circle cx="50" cy="50" r="5.5" fill="#c8262c"/>
</svg>
      <div><b>SCOUT</b><small>Supply Chain Operational Vulnerability and Threat Assessment</small></div>
    </div>
    <nav class="nav" id="nav"></nav>
    <div class="ctx" id="ctx"></div>
    <div class="foot">
      <button class="btn-ghost" data-act="new">+ New assessment</button>
      <span>Concept prototype for an MIT CTL-mentored graduate project. Not a validated tool; not endorsed by MIT.</span>
    </div>
  </aside>
  <main class="main">
    <div class="topbar"><span class="pill"><i></i>Concept demo · synthetic data · provisional rules</span></div>
    <div class="wrap" id="view"></div>
  </main>
</div>
<div class="toast" id="toast" hidden></div>

<script>
/* ============================================================
   SCOUT interactive prototype
   Profile → Tier 1 screener → triggered deep dive (Framework v0.1)
   Every item is tagged Finance / Data / Production; the router
   guarantees coverage of all three. Scoring is deterministic;
   the Risk Advisor shows where the RAG API plugs in.
   ============================================================ */

const AREAS = {F:'Finance', D:'Data', P:'Production'};
const LINKS = [
  {k:'proc', n:'Procurement & sourcing', inc:11},
  {k:'prod', n:'Production & manufacturing', inc:107},
  {k:'ware', n:'Warehousing', inc:9},
  {k:'dist', n:'Distribution & fulfillment', inc:195},
  {k:'sales',n:'Sales, retail & e-commerce', inc:87},
  {k:'serv', n:'Service delivery', inc:345}
];
const HANDOFFS = [2,1,8,28,7]; // example co-occurrence counts between neighbouring links
const LINKNAME = Object.fromEntries(LINKS.map(l=>[l.k,l.n])); LINKNAME.org = 'Shared IT, data & finance';

const SECTORS = [
  {k:'mfg', t:'We make, assemble or machine products', s:'Factories, workshops, component plants', label:'Manufacturing', main:'prod',
   procs:['Production scheduling (MES)','Line and machine control','Inbound materials','Order to cash','Outbound shipping']},
  {k:'retail', t:'We sell products in stores or online', s:'Shops, chains, online stores, marketplaces', label:'Retail & e-commerce', main:'sales',
   procs:['Online store','Point of sale','Replenishment','Customer service','Payments and refunds']},
  {k:'log', t:'We move, store or deliver goods for others', s:'Trucking, freight, warehousing, 3PL, couriers', label:'Transportation & logistics', main:'dist',
   procs:['Route planning and dispatch','Warehouse management','Carrier booking and tracking','Customs and documents','Billing and settlement']},
  {k:'health', t:'We provide care or make health products', s:'Clinics, hospitals, labs, medical devices, pharma', label:'Healthcare', main:'serv',
   procs:['Patient records','Lab and diagnostics','Medical supplies','Device production','Billing and claims']},
  {k:'food', t:'We grow, process or distribute food or drinks', s:'Farms, dairies, bakeries, beverage, food service', label:'Food & beverage', main:'ware',
   procs:['Cold chain monitoring','Processing line','Lot traceability','Distribution routes','Supplier intake']},
  {k:'other', t:'Something else', s:'Describe it and SCOUT will suggest the closest category', label:'Other', main:'prod',
   procs:['Main operational system','Supplier intake','Order to cash','Customer delivery','Internal IT']}
];
const SECTOR = Object.fromEntries(SECTORS.map(s=>[s.k,s]));

const LEVELS = [
  {k:'exec', t:'Executive or owner', s:'Decides budget and strategy'},
  {k:'mgr',  t:'Manager or supervisor', s:'Runs a team or a site'},
  {k:'eng',  t:'Engineer or technician', s:'Works with systems and equipment'},
  {k:'ops',  t:'Operator or administrative', s:'Does day-to-day tasks'}
];
const RESP = [
  ['owner','I own or run the business'],['fin','Finance, payments or accounting'],['buy','Buying, suppliers and sourcing'],
  ['plan','Inventory, planning and logistics flows'],['prod','Production, sites or daily operations'],
  ['it','Running IT systems, networks or security'],['ciso','Leading technology or security strategy']

function route(s){
  const items=[]; const seen=new Set(); const dropped=[];
  const add=(id,stage,why,mod)=>{ if(seen.has(id)) return; seen.add(id); items.push({id,stage,why,mod:mod||Q[id].mod}); };
  SCREEN.forEach(id=>add(id,'screen','Asked of every organization'));
  CORE.forEach(id=>add(id,'core','Core item: keeps results comparable across companies'));
  const deep=[];
  MODULES.forEach(m=>{ const r=m.when(s); if(!r) return; m.items.forEach(id=>{ if(!seen.has(id)&&depthOK(Q[id],s)&&!deep.find(d=>d.id===id)) deep.push({id,stage:'deep',why:r,mod:m.name,rank:m.rank}); }); });
  deep.sort((a,b)=>a.rank-b.rank);
  const room=CAP-items.length;
  deep.forEach((d,i)=>{ if(i<room){ seen.add(d.id); items.push(d);} else dropped.push(d); });
  // coverage rule: at least 3 items per area
  ['F','D','P'].forEach(a=>{
    let n=items.filter(it=>Q[it.id].area.includes(a)).length;
    if(n>=3) return;
    Object.keys(Q).forEach(id=>{ if(n>=3||seen.has(id)||Q[id].sectorQ) return; if(Q[id].area.includes(a)&&depthOK(Q[id],s)){ seen.add(id); items.push({id,stage:'deep',why:'Added so every route covers '+AREAS[a].toLowerCase(),mod:Q[id].mod,cov:true}); n++; } });

  const area={};
  ['F','D','P'].forEach(a=>{ const xs=answered.filter(i=>Q[i.id].area.includes(a)).map(i=>risk(s,i.id)); area[a]={n:xs.length,total:items.filter(i=>Q[i.id].area.includes(a)).length,score:xs.length?Math.round(100*xs.reduce((x,y)=>x+y,0)/xs.length):null}; });
  const valid=['F','D','P'].filter(a=>area[a].score!==null);
  const index=valid.length?Math.round(valid.reduce((x,a)=>x+area[a].score,0)/valid.length):null;
  // pain points
  const pains=answered.filter(i=>s.answers[i.id]!=='u'&&risk(s,i.id)>=.67).map(i=>({id:i.id,link:linkOf(Q[i.id],s),title:Q[i.id].pain,r:risk(s,i.id),area:Q[i.id].area,why:Q[i.id].why}));
  if(risk(s,'C2')>=.7&&risk(s,'E1')>=.5&&s.answers.C2!=='u'&&s.answers.E1!=='u') pains.push({id:'GAP',link:mainLink(s),title:'Recovery is slower than you can tolerate',r:.85,area:['P'],why:'You can be down for '+Q.C2.o[s.answers.C2][0].toLowerCase()+', but recovery takes '+Q.E1.o[s.answers.E1][0].toLowerCase()+'.'});
  // links
  const links={};
  [...LINKS.map(l=>l.k),'org'].forEach(k=>{ const xs=answered.filter(i=>linkOf(Q[i.id],s)===k).map(i=>risk(s,i.id)); const m=xs.length?xs.reduce((x,y)=>x+y,0)/xs.length:null; links[k]={n:xs.length,mean:m,lvl:m===null?'N':m>=.67?'H':m>=.4?'M':'L',pains:pains.filter(p=>p.link===k)}; });
  // actions
  const weakest=valid.slice().sort((a,b)=>area[b].score-area[a].score)[0];
  const acts=[];
  pains.forEach(p=>{ const q=Q[p.id]; if(p.id==='GAP'){ acts.push({t:'Close the gap between recovery time and tolerable downtime for "'+(s.dep.procs[0]||'the main process')+'"',cost:2,fn:'Recover',area:['P'],link:p.link,score:.95}); return; } if(!q.action) return; acts.push({t:q.action[0],cost:q.action[1],fn:q.action[2],area:q.area,link:p.link,score:p.r+(q.area.includes(weakest)?.08:0)}); });
  unknown.forEach(i=>{ const q=Q[i.id]; acts.push({t:'Find out: '+(q.p.replace(/\?$/,'').replace(/^(Do|Does|Is|Are|Can|Could|How|Who|When|Would|If)\s/,m=>m.toLowerCase())),cost:1,fn:'Identify',area:q.area,link:linkOf(q,s),score:.5,unk:true}); });
  acts.sort((a,b)=>b.score-a.score);

}

/* ---------- Real TRACE retrieval (baseline: precomputed embeddings, cosine in the browser) ---------- */
let TRACE=null, STRONG=.55;
async function loadTrace(){
  try{
    const [T,I]=await Promise.all([fetch('trace_index.json').then(r=>{if(!r.ok)throw 0;return r.json();}),fetch('item_vectors.json').then(r=>{if(!r.ok)throw 0;return r.json();})]);
    const dec=b=>Int8Array.from(atob(b),c=>c.charCodeAt(0));      // base64 -> int8 (x127 scale)
    if(T.dim!==I.dim) throw new Error('Model mismatch: TRACE and item vectors have different sizes');
    TRACE={meta:T.meta.map(m=>({...m,...splitCase(m)})),tv:dec(T.vectors),iv:dec(I.vectors),idx:Object.fromEntries(I.keys.map((k,i)=>[k,i])),D:T.dim,model:T.model,boost:T.sector_boost??.03};
    if(typeof T.strong_threshold==='number') STRONG=T.strong_threshold;
  }catch(e){ TRACE=null; }                                           // files missing -> synthetic demo cases
}
const DEMO_TITLE={'TR-S014':'Shared carrier passwords used to change pickups','TR-S027':'Ransomware encrypts transport management system','TR-S033':'Office ransomware spreads into plant network','TR-S041':'Sole machined-part supplier hit by ransomware','TR-S052':'Marketing partner leaks retailer customer data','TR-S058':'Cold-chain monitoring lost during IT outage','TR-S063':'Fake fuel-supplier email redirects invoice payments','TR-S070':'Hijacked mailbox requests urgent payment','TR-S077':'Records system encrypted and backups fail','TR-S081':'Customs platform outage strands trucks at the border','TR-S088':'Shared e-commerce provider outage hits retailers','TR-S094':'Vendor remote access abused on a control system','TR-S101':'No incident decision-maker lets infection spread','TR-S109':'Service provider admin account pushes malware'};

/* TRACE files store the summary as "Title. Summary"; newer exports also carry "title".
   Split on the first sentence end that is not an abbreviation such as "U.S." or "Inc." */
const ABBR=/(?:\b[A-Z](?:\.[A-Z])*|\b(?:Inc|Co|Corp|Ltd|St|No|Jr|Sr|vs|Dr|Mr|Ms|Mt|Ft|Gov|Dept))$/;
function splitCase(m){
  const s=String(m.summary||m.sum||'');
  if(m.title) return {title:m.title,sum:s.startsWith(m.title)?s.slice(m.title.length).replace(/^[.\s]+/,''):s};
  const re=/\.\s/g; let x;
  while((x=re.exec(s))&&x.index<180){ if(!ABBR.test(s.slice(0,x.index))) return {title:s.slice(0,x.index),sum:s.slice(x.index+2)}; }
  return {title:s.length>90?s.slice(0,90).replace(/\s\S*$/,'')+'…':s,sum:s};
}
function firstSentence(s){ const re=/\.\s/g; let x; while((x=re.exec(s))){ if(!ABBR.test(s.slice(0,x.index))) return s.slice(0,x.index+1); } return s; }
function similar(s,r){ return TRACE?similarReal(s):similarDemo(s,r); }
function similarReal(s){
  const {D,tv,iv,idx,meta,boost}=TRACE; const q=new Float32Array(D);
  for(const [id,a] of Object.entries(s.answers)){
    if(a==='u'||idx[id]===undefined) continue;                       // unknowns and unmapped items don't steer retrieval
    const w=risk(s,id); if(!w) continue;                             // weight = risk of the chosen option
    const o=idx[id]*D; for(let d=0;d<D;d++) q[d]+=w*iv[o+d];
  }
  let n=0; for(let d=0;d<D;d++) n+=q[d]*q[d]; n=Math.sqrt(n);
  if(!n) return [];
  const out=new Array(meta.length);
  for(let j=0;j<meta.length;j++){ let dot=0; const o=j*D; for(let d=0;d<D;d++) dot+=q[d]*tv[o+d];
    out[j]={...meta[j],sim:dot/(n*127)+(meta[j].sector===s.org.sector?boost:0)}; }  // cosine + soft sector boost
  return out.sort((a,b)=>b.sim-a.sim).slice(0,5);
}
function similarDemo(s,r){
  const user=new Set();
  r.pains.forEach(p=>{ user.add('L:'+p.link); p.area.forEach(a=>user.add('A:'+a)); (Q[p.id]?Q[p.id].tag:['outage']).forEach(t=>user.add('T:'+t)); });
  if(!user.size) user.add('L:'+mainLink(s));
  return CASES.map(c=>{
    const cs=new Set([...c.links.map(l=>'L:'+l),...c.areas.map(a=>'A:'+a),...c.tags.map(t=>'T:'+t)]);
    let inter=0; cs.forEach(x=>{ if(user.has(x)) inter++; });
    const uni=new Set([...cs,...user]).size;
    const boost=c.sector===s.org.sector?.15:0; // soft sector boost, never a filter
    return Object.assign({},c,{sim:Math.min(.99,inter/uni*1.3+boost)});
  }).sort((a,b)=>b.sim-a.sim).slice(0,5);
}

function ring(v){
  const C=2*Math.PI*48; const p=v===null?0:v/100; const col=v===null?'var(--dim)':v>=67?'var(--crit)':v>=40?'var(--warn)':'var(--ok)';
  return `<div class="ring"><svg width="118" height="118" viewBox="0 0 118 118" aria-hidden="true"><circle cx="59" cy="59" r="48" fill="none" stroke="var(--line)" stroke-width="10"/><circle cx="59" cy="59" r="48" fill="none" stroke="${col}" stroke-width="10" stroke-linecap="round" stroke-dasharray="${C*p} ${C}"/></svg><div class="v"><div><b>${v===null?'–':v}</b><small>of 100</small></div></div></div>`;
}

function diagnosis(s,R,cases){
  const w=wording(s); const strong=cases.filter(c=>c.sim>=STRONG);
  if(strong.length<2) return `<p>Only ${strong.length} close match${strong.length===1?'':'es'} found. SCOUT does not write an explanation when fewer than two strong matches exist; the cases are shown below for you to read.</p>`;
  const weak=R.weakest?AREAS[R.weakest]:'Production'; const top=R.pains.slice().sort((a,b)=>b.r-a.r);
  const p1=top[0], p2=top[1]; const a1=R.acts[0];
  const cite=c=>`<cite>[${cases.indexOf(c)+1}]</cite>`;
  const dis=strong.filter(c=>c.impact==='Operational disruption');
  const terms=s.you.ops==='new';
  if(w==='technical') return `<p>Highest exposure is in <b>${weak.toLowerCase()}</b> (score ${R.area[R.weakest].score}). The primary finding is “${esc(p1?p1.title:'no pain point')}”${p2?`, compounded by “${esc(p2.title)}”`:''}.</p>
    <p>Retrieved neighbours share the same failure pattern: ${strong.slice(0,3).map(c=>'“'+esc(c.title)+'” '+cite(c)).join('; ')}. ${dis.length} of ${strong.length} strong matches resulted in operational disruption.</p>
    <p>Recommended first control: <b>${esc(a1?a1.t:'—')}</b> (${a1?a1.fn:''}, ${a1?['','low','medium','high'][a1.cost]:''} cost).</p>`;
  return `<p>Your biggest gap is in <b>${weak.toLowerCase()}</b>. The clearest warning sign is: ${esc(p1?p1.title.toLowerCase():'none found')}${p2?`, and ${esc(p2.title.toLowerCase())}`:''}.</p>
    <p>Companies with similar answers ran into trouble in the same way. For example, “${esc(strong[0].title)}” ${cite(strong[0])}: ${esc(firstSentence(strong[0].sum))}${strong[1]?` Another close case is “${esc(strong[1].title)}” ${cite(strong[1])}.`:''}</p>
    <p>A good first step is to <b>${esc(a1?a1.t.charAt(0).toLowerCase()+a1.t.slice(1):'answer more questions')}</b>.${terms?' (A “fallback” is the way you keep working by hand while systems are down.)':''}</p>`;
}

function payload(s,R,cases){
  return {
    assessment_id:'demo-'+(s.sample||'custom'),
    profile:{sector:s.org.sector,country:s.org.country,size:s.org.size,role_level:s.you.level,responsibilities:s.you.resp,chain_links:s.you.links,cyber_familiarity:s.you.freq,ops_familiarity:s.you.ops,wording:wording(s),dependencies:s.dep.deps,focus_processes:s.dep.procs},
    answers:R.answered.map(i=>({code:Q[i.id].code,item:i.id,areas:Q[i.id].area,link:linkOf(Q[i.id],s),value:s.answers[i.id]==='u'?'unknown':Q[i.id].o[s.answers[i.id]][1],risk:risk(s,i.id)})),
    not_asked:R.notAsked.map(id=>Q[id].code),
    deterministic:{priority_index:R.index,areas:{finance:R.area.F.score,data:R.area.D.score,production:R.area.P.score},pain_points:R.pains.map(p=>({title:p.title,link:p.link,areas:p.area}))},
    retrieval:{k:5,sector_boost:0.15,filter_by_sector:false},
    expected_response:{similar_incidents:'[{trace_id, summary, similarity, links, impact}]',diagnosis:'string, cites trace_ids',recommendations:'[{priority, action, why, evidence:[trace_id], area}]'}
  };
}

function vAdvisor(){
  const R=results(S); const cases=similar(S,R); const strong=cases.filter(c=>c.sim>=STRONG);
  const dis=strong.filter(c=>c.impact==='Operational disruption').length;
  const json=JSON.stringify(payload(S,R,cases),null,2);
  return `<header><div class="eyebrow">Risk Advisor</div><h1>Real incidents most like yours</h1><p class="lede">The five closest incidents from the MIT TRACE registry and what happened afterwards. Every statement cites its case. If too few cases are close, SCOUT says so instead of guessing.</p></header>
  ${TRACE?`<div class="note"><b>Connected to TRACE:</b> ${TRACE.meta.length} incidents · ${esc(TRACE.model)} · strong match ≥ ${STRONG.toFixed(2)}. Retrieval runs in your browser; the diagnosis text is templated from the cited cases.</div>`:`<div class="note warn"><b>Demo mode:</b> trace_index.json and item_vectors.json were not found next to this page, so the cases below are synthetic placeholders.</div>`}
  <div class="cols3">
   <div style="display:grid;gap:16px;min-width:0">
    <section class="card diag"><div class="split" style="margin-bottom:10px"><span class="lbl">Diagnosis · ${wording(S)} wording</span><span class="pill fv">Generated by RAG later</span></div>${diagnosis(S,R,cases)}</section>
    ${cases.length?'':'<p class="help">Answer at least one question with a weak answer to search for similar incidents.</p>'}
    <div class="lbl">Similar cases</div>
    ${cases.map((c,i)=>`<article class="case"><div class="split"><b title="TRACE incident ${esc(c.id)}"><span class="cn">${i+1}</span>${esc(c.title)}</b><span class="match ${c.sim>=STRONG?'s':'w'}">${c.sim>=STRONG?'Strong':'Weak'} match · ${c.sim.toFixed(2)}</span></div><p style="margin:0">${esc(c.sum)}</p>${c.url?`<a href="${esc(c.url)}" target="_blank" rel="noopener" class="mono">Read the source</a>`:''}<span class="mono">Sector: ${esc(SECTOR[c.sector]?SECTOR[c.sector].label:c.sector)} · Links: ${(c.links||[]).map(l=>esc(LINKNAME[l]?LINKNAME[l].split(' ')[0]:l)).join(', ')||'n/a'} · Impact: ${esc(c.impact)}</span><div class="chips" style="gap:5px">${(c.areas||[]).map(a=>`<span class="tag ${a}">${AREAS[a]}</span>`).join('')}</div></article>`).join('')}
    <section class="card"><div class="lbl" style="margin-bottom:10px">Ask a follow-up</div><div class="chat" id="chat">${S.chat.map(m=>`<div class="bubble ${m.me?'me':''}">${m.me?esc(m.t):m.t}</div>`).join('')}</div>
     <form class="inline" id="ask" style="margin-top:10px"><input type="text" id="f-ask" placeholder="e.g. What would a small carrier do first?" aria-label="Follow-up question"><button class="btn" type="submit">Ask</button></form>
     <p class="help" style="margin-top:8px">Answers use your wording level and only what the cited cases support.</p></section>
   </div>
   <aside class="side">
    <div class="card"><div class="lbl">What happened in similar cases</div><p style="margin:10px 0 4px"><span class="big">${dis} of ${strong.length||5}</span></p><p class="help">strong matches had operational disruption. These are past frequencies, not the probability that it happens to you.</p></div>
    <div class="card"><div class="lbl" style="margin-bottom:8px">Weakest area</div><h2>${R.weakest?AREAS[R.weakest]:'–'}</h2><p class="help">Recommendations are checked to make sure at least one addresses it.</p></div>
    <div class="card soft" style="border-color:rgba(242,169,59,.45)"><h3 style="color:var(--warn)">When there are few similar cases</h3><p class="help" style="margin-top:6px">With fewer than two strong matches, SCOUT shows only the cases it found and writes no explanation.</p></div>
    <div class="card"><details><summary>Request to the RAG API</summary><p class="help" style="margin:8px 0">This is the JSON the app would POST to <span class="mono">/assess</span>. Copy it to test your notebook.</p><pre class="json" id="json">${esc(json)}</pre><button class="btn2" style="margin-top:10px" data-act="copy">Copy JSON</button></details></div>
   </aside>
  </div>`;
}

function vMethod(){
  return `<header><div class="eyebrow">Methodology</div><h1>How SCOUT decides what to ask and what to show</h1><p class="lede">A concept prototype. Questions, weights and risk values are proposed parameters, not validated against incident data.</p></header>
  <section class="card"><div class="lbl" style="margin-bottom:12px">Layers</div><div class="layers">
    ${[['1','Profile','Sector, role, responsibilities, two familiarity dials, dependencies, focus processes. Sets wording and routing only.'],['2','Tier 1 screener','Nine plain questions for every organization, including one written for the sector.'],['3','Core + deep dive','Six core items for comparability, then Framework v0.1 modules opened by triggers. Capped at '+CAP+'.'],['4','Deterministic scoring','Finance, data and production scores; priority index; pain points on the value stream map.'],['5','RAG advisor','Top-5 TRACE incidents with a soft sector boost; diagnosis and actions cite their cases.']].map(([k,t,d])=>`<div class="layer"><span class="k">Layer ${k}</span><h3>${t}</h3><p class="help">${d}</p></div>`).join('')}
  </div></section>
  <section class="card"><div class="lbl" style="margin-bottom:10px">Routing rules</div><div class="tablewrap"><table><thead><tr><th>Module</th><th>Opens when</th><th>Items</th><th>Areas</th></tr></thead><tbody>
    ${MODULES.map(m=>{ const ar=[...new Set(m.items.flatMap(i=>Q[i].area))]; const rule={ot:'Sector is manufacturing, or machines/sensors selected',fin:'Payments selected, finance role, or bank changes not always verified (S8)',vendor:'Vendor remote access (S4), or managed service provider',conc:'Single-source supplier (S1), or key suppliers selected',backup:'Backups not proven (S3), or data selected',conf:'Records or payments selected, or healthcare/retail sector',logi:'Logistics sector, partners or customs documents selected',ir:'No practiced incident plan (S6), or email selected',scale:'250+ people',impact:'Business-side role or low cyber familiarity',tech:'Technical wording'}[m.k]; return `<tr><td>${m.name}</td><td>${rule}</td><td class="mono">${m.items.map(i=>Q[i].code).join(', ')}</td><td>${ar.map(a=>`<span class="tag ${a}">${AREAS[a]}</span>`).join(' ')}</td></tr>`; }).join('')}
  </tbody></table></div>
  <p class="help" style="margin-top:12px">Depth: items marked technical appear only with technical wording; consequence items appear for business-side profiles. Coverage rule: if any area has fewer than three items, SCOUT adds items for it from the bank. FIN1–FIN4, G6, DC1 and DC2 are new items proposed for Framework v0.1.</p></section>
  <section class="card"><div class="lbl" style="margin-bottom:10px">Scoring notes</div>
   <p class="help"><b style="color:var(--fg)">M1.</b> Technical severity is not operational consequence. A CVSS score is never converted directly into a SCOUT priority.<br><b style="color:var(--fg)">M2.</b> “I don't know” is scored at moderate concern (0.6) and becomes a “find out” action. Items skipped by routing are stored as not asked and are never scored.<br><b style="color:var(--fg)">M3.</b> Each area score is the mean risk of its answered items; the priority index is the mean of the three areas. Weights are provisional.<br><b style="color:var(--fg)">M4.</b> Scoring runs without any generative AI. The RAG model only retrieves similar incidents and writes the explanation.</p></section>
  <section class="card"><div class="lbl" style="margin-bottom:10px">Limitations</div><p class="help">Sample organizations, incident cases and counts are synthetic. Data stays in this browser. Self-assessment reflects the respondent's knowledge; unknowns are shown, not hidden. Regulations and live threat feeds (CVSS, CISA KEV, EPSS) are planned, not connected.</p></section>`;
}

/* ---------- Events ---------- */
function setPath(path,val){ const [a,b]=path.split('.'); S[a][b]=val; }
function toast(t){ const el=$('#toast'); el.textContent=t; el.hidden=false; clearTimeout(toast.h); toast.h=setTimeout(()=>el.hidden=true,2200); }

document.addEventListener('click',e=>{
  const b=e.target.closest('button'); if(!b||b.disabled) return;
  const d=b.dataset;
  if(d.go){ go(d.go); return; }
  if(d.set){ setPath(d.set,d.val); S.sample=null; if(d.set==='org.sector'){ S.dep.procs=[]; S.sel=null; } render(); return; }
  if(d.tog){ const [a,k]=d.tog.split('.'); const arr=S[a][k]; const i=arr.indexOf(d.val); i<0?arr.push(d.val):arr.splice(i,1); S.sample=null; render(); return; }
  if(d.dep){ const arr=S.dep.deps; const i=arr.indexOf(d.dep); if(i>=0) arr.splice(i,1); else { if(d.dep==='ns'){ arr.length=0; } else { const j=arr.indexOf('ns'); if(j>=0) arr.splice(j,1);} if(arr.filter(x=>x!=='ns').length<3||d.dep==='ns') arr.push(d.dep); } S.sample=null; render(); return; }
  if(d.proc){ const arr=S.dep.procs; const i=arr.indexOf(d.proc); i>=0?arr.splice(i,1):arr.length<2&&arr.push(d.proc); render(); return; }
  if(d.word){ S.wordOverride=d.word; render(); return; }
  if(d.sample){ S=sample(d.sample); toast('Loaded '+S.org.name+' (synthetic sample)'); render(); return; }
  if(d.ans!==undefined){ const items=route(S).items; const id=items[S.cur].id; S.answers[id]=d.ans==='u'?'u':+d.ans; render(); return; }
  if(d.jump!==undefined){ S.cur=+d.jump; render(); return; }
  if(d.sel){ S.sel=d.sel; render(); return; }
  if(d.budget){ S.budget=+d.budget; render(); return; }
  const act=d.act;
  if(act==='next'){ S.cur++; render(); window.scrollTo(0,0); }
  else if(act==='prev'){ S.cur--; render(); }
  else if(act==='start'){ const items=route(S).items; const first=items.findIndex(i=>S.answers[i.id]===undefined); S.cur=first<0?0:first; go('assessment'); }
  else if(act==='reset'){ if(b.dataset.confirm){ S.answers={}; S.cur=0; S.chat=[]; render(); toast('Answers cleared'); } else { b.dataset.confirm='1'; b.textContent='Click again to clear'; setTimeout(()=>{ if(b.isConnected){ b.textContent='Reset answers'; delete b.dataset.confirm; } },2500); } }
  else if(act==='new'){ S=blank(); go('organization'); toast('New assessment started'); }
  else if(act==='copy'){ const t=$('#json').textContent; navigator.clipboard.writeText(t).then(()=>toast('JSON copied'),()=>{ const r=document.createRange(); r.selectNodeContents($('#json')); const sel=getSelection(); sel.removeAllRanges(); sel.addRange(r); toast('Selected, press Ctrl+C to copy'); }); }
});
document.addEventListener('input',e=>{ const el=e.target; if(el.dataset.bind){ setPath(el.dataset.bind,el.value); S.sample=null; save(); if(el.id==='f-name'){ const c=$('#ctx b'); if(c) c.textContent=el.value||'Unnamed organization'; } } });
document.addEventListener('change',e=>{ const el=e.target; if(el.tagName==='SELECT'&&el.dataset.bind){ setPath(el.dataset.bind,el.value); render(); } });
document.addEventListener('submit',e=>{
  if(e.target.id!=='ask') return; e.preventDefault();
  const inp=$('#f-ask'); const t=inp.value.trim(); if(!t) return;
  const R=results(S); const all=similar(S,R); const cases=all.filter(c=>c.sim>=STRONG); const n=c=>all.indexOf(c)+1; const a=R.acts.find(x=>x.cost<=S.budget)||R.acts[0];
  const ans=cases.length<2?'There are not enough close cases to answer that from evidence. Try answering more questions first.':
    (wording(S)==='technical'?`Based on ${cases.length} strong matches, prioritise <b>${esc(a?a.t:'')}</b> (${a?a.fn:''}). Similar organisations that skipped this step saw longer recovery <cite>[${n(cases[0])}]</cite>${cases[1]?` <cite>[${n(cases[1])}]</cite>`:''}.`:
    `The closest cases suggest starting with <b>${esc(a?a.t.charAt(0).toLowerCase()+a.t.slice(1):'')}</b>. It fits a ${['','low','medium','high'][S.budget]} budget, and companies that lacked it took longer to get back to normal <cite>[${n(cases[0])}]</cite>.`);
  S.chat.push({me:true,t}); S.chat.push({me:false,t:ans+' <span class="mono">· synthetic answer; the RAG API will generate this</span>'});
  render(); const f=$('#f-ask'); if(f) f.focus();
});
window.addEventListener('hashchange',render);
load(); render(); loadTrace().then(()=>{ if(TRACE){ render(); toast('Connected to '+TRACE.meta.length+' TRACE incidents'); } });
</script>
